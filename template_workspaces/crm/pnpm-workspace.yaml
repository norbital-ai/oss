allowBuilds:
  esbuild: true

# Only these exact, reviewed first-party releases bypass the minimum-release-age gate.
#
# Pinned by version on purpose, and deliberately not by a scope-wide wildcard. The gate's value
# against our own packages is the case where the publish credential is stolen: a wildcard would
# install that attacker's release the moment it appeared, which is exactly the window the gate
# exists to close. Adding a line here states that this exact version was built from reviewed
# source in this repository.
#
# Publishing therefore means updating this list in every template, and
# scripts/tests/templates.test.mjs enforces it. Forgetting surfaces as
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION inside a tenant sandbox build.
minimumReleaseAgeExclude:
  - '@norbital-ai/config@4.0.1'
  - '@norbital-ai/platform-utils@4.0.1'
  - '@norbital-ai/pod@4.0.1'
  - '@norbital-ai/std@4.0.1'
  - '@norbital-ai/ui@4.0.1'

# Host tools execute from this depset, while tenant builds execute in a Linux/musl microVM.
# Include both host-native and guest-native optional packages on macOS, Windows, and Linux hosts.
supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
