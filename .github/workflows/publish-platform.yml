name: Publish platform release

on:
  push:
    tags:
      - 'platform-v*'
  workflow_dispatch:
    inputs:
      release_name:
        description: Human release name used for the immutable tag, for example 2026.07.29.1
        required: true
        type: string

concurrency:
  group: platform-release-${{ github.ref }}-${{ inputs.release_name }}
  cancel-in-progress: false

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write
  packages: write

env:
  OCI_REGISTRY: ${{ vars.NORBITAL_OCI_REGISTRY || 'ghcr.io' }}
  OCI_NAMESPACE: ${{ vars.NORBITAL_OCI_NAMESPACE || github.repository_owner }}
  PACKAGE_REGISTRY_URL: ${{ vars.NORBITAL_PACKAGE_REGISTRY || 'https://npm.pkg.github.com' }}
  MAX_IMAGE_BYTES: ${{ vars.NORBITAL_MAX_IMAGE_BYTES || '500000000' }}
  BENCHMARK_TEMPLATE: ${{ vars.NORBITAL_BENCHMARK_TEMPLATE || 'construction' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.release.outputs.release_name }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      package_key: ${{ steps.versions.outputs.package_key }}
      template_dependency_key: ${{ steps.template-dependencies.outputs.template_dependency_key }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install and verify publishable packages
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm check

      - name: Resolve immutable release identity
        id: release
        env:
          REQUESTED_RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
            release_name="${GITHUB_REF_NAME#platform-v}"
          else
            release_name="$REQUESTED_RELEASE_NAME"
            release_tag="platform-v${release_name}"
          fi
          if [[ ! "$release_name" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "Invalid release name: $release_name" >&2
            exit 1
          fi
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Verify template toolchain dependencies
        id: template-dependencies
        run: |
          node scripts/resolve-template-toolchain.mjs \
            --check \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify published package archives
        id: versions
        env:
          NPM_REGISTRY_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN }}
          GITHUB_PACKAGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/resolve-published-packages.mjs \
            --registry "$PACKAGE_REGISTRY_URL" \
            --output dist/package-release.json \
            --archive-output dist/package-archives \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload verified package release
        uses: actions/upload-artifact@v7
        with:
          name: package-release-${{ steps.release.outputs.release_name }}
          path: |
            dist/package-release.json
            dist/package-archives/*.tgz
          if-no-files-found: error
          retention-days: 90

  builder:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.reference }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image reference
        id: image
        run: echo "reference=${OCI_REGISTRY}/${OCI_NAMESPACE}/norbital-builder" >> "$GITHUB_OUTPUT"

      - name: Download verified package archives
        uses: actions/download-artifact@v8
        with:
          name: package-release-${{ needs.prepare.outputs.release_name }}
          path: dist

      - name: Login to OCI registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.OCI_REGISTRY }}
          username: ${{ vars.NORBITAL_OCI_USERNAME || github.actor }}
          password: ${{ secrets.NORBITAL_OCI_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push builder image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/builder/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.image.outputs.reference }}:${{ needs.prepare.outputs.release_name }}
            ${{ steps.image.outputs.reference }}:sha-${{ github.sha }}
          build-args: |
            PLATFORM_FINGERPRINT=${{ needs.prepare.outputs.package_key }}
            TEMPLATE_DEPENDENCY_ID=${{ needs.prepare.outputs.template_dependency_key }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=platform-builder
          cache-to: type=gha,mode=max,scope=platform-builder

      - name: Enforce builder image size
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "${IMAGE}@${DIGEST}"
          image_bytes=$(docker image inspect "${IMAGE}@${DIGEST}" --format '{{.Size}}')
          echo "Builder image size: ${image_bytes} bytes"
          test "$image_bytes" -le "$MAX_IMAGE_BYTES"

      - name: Verify every active template in the published builder
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node scripts/verify-builder-toolchain.mjs \
            --image "${IMAGE}@${DIGEST}" \
            --expected-package-key "${{ needs.prepare.outputs.package_key }}" \
            --expected-template-dependency-key "${{ needs.prepare.outputs.template_dependency_key }}" \
            --output dist/builder-toolchain-verification.json

      - name: Benchmark every active template
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p dist/builder-benchmarks
          node -e \
            "for (const template of require('./release/templates.json').templates) console.log(template.key)" \
            | while read -r template; do
                node scripts/benchmark-builder.mjs \
                  --image "${IMAGE}@${DIGEST}" \
                  --template "$template" \
                  --expected-package-key "${{ needs.prepare.outputs.package_key }}" \
                  --output "dist/builder-benchmarks/${template}.json"
              done
          cp "dist/builder-benchmarks/${BENCHMARK_TEMPLATE}.json" dist/builder-benchmark.json
          {
            echo "### Tenant builder all-template release gate"
            echo
            for benchmark in dist/builder-benchmarks/*.json; do
              echo "#### $(basename "$benchmark" .json)"
              echo
              echo '```json'
              cat "$benchmark"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest builder toolchain verification
        uses: actions/attest@v4
        with:
          subject-path: dist/builder-toolchain-verification.json

      - name: Attest builder benchmarks
        uses: actions/attest@v4
        with:
          subject-path: dist/builder-benchmarks/*.json

      - name: Upload builder evidence
        uses: actions/upload-artifact@v7
        with:
          name: builder-benchmark-${{ needs.prepare.outputs.release_name }}
          path: |
            dist/builder-toolchain-verification.json
            dist/builder-benchmark.json
            dist/builder-benchmarks/*.json
          if-no-files-found: error
          retention-days: 90

      - name: Attest builder image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.reference }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  runtime:
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.image.outputs.reference }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image reference
        id: image
        run: echo "reference=${OCI_REGISTRY}/${OCI_NAMESPACE}/norbital-runtime" >> "$GITHUB_OUTPUT"

      - name: Login to OCI registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.OCI_REGISTRY }}
          username: ${{ vars.NORBITAL_OCI_USERNAME || github.actor }}
          password: ${{ secrets.NORBITAL_OCI_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push runtime image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: containers/runtime/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.image.outputs.reference }}:${{ needs.prepare.outputs.release_name }}
            ${{ steps.image.outputs.reference }}:sha-${{ github.sha }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=platform-runtime
          cache-to: type=gha,mode=max,scope=platform-runtime

      - name: Enforce runtime image size
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "${IMAGE}@${DIGEST}"
          image_bytes=$(docker image inspect "${IMAGE}@${DIGEST}" --format '{{.Size}}')
          echo "Runtime image size: ${image_bytes} bytes"
          test "$image_bytes" -le "$MAX_IMAGE_BYTES"

      - name: Attest runtime image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.image.outputs.reference }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  catalogue:
    needs:
      - prepare
      - builder
      - runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve template projections
        env:
          SOURCE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          node scripts/project-templates.mjs \
            --source-revision "$GITHUB_SHA" \
            --repository "$SOURCE_REPOSITORY_URL" \
            --push origin \
            --output dist/template-revisions.json

      - name: Download verified package release
        uses: actions/download-artifact@v8
        with:
          name: package-release-${{ needs.prepare.outputs.release_name }}
          path: dist

      - name: Generate platform release manifest
        env:
          BUILDER_IMAGE_DIGEST: ${{ needs.builder.outputs.digest }}
          BUILDER_IMAGE_REFERENCE: ${{ needs.builder.outputs.image }}
          RUNTIME_IMAGE_DIGEST: ${{ needs.runtime.outputs.digest }}
          RUNTIME_IMAGE_REFERENCE: ${{ needs.runtime.outputs.image }}
          SOURCE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SOURCE_REVISION: ${{ github.sha }}
          TEMPLATE_REVISIONS_FILE: dist/template-revisions.json
          PACKAGE_RELEASE_FILE: dist/package-release.json
          PACKAGE_MIRROR_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.release_tag }}/
        run: node scripts/generate-platform-release.mjs

      - name: Download builder benchmark
        uses: actions/download-artifact@v8
        with:
          name: builder-benchmark-${{ needs.prepare.outputs.release_name }}
          path: dist

      - name: Attest platform release manifest
        uses: actions/attest@v4
        with:
          subject-path: dist/platform-release.json

      - name: Upload platform release manifest
        uses: actions/upload-artifact@v7
        with:
          name: platform-release-${{ needs.prepare.outputs.release_name }}
          path: dist/platform-release.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Platform ${{ needs.prepare.outputs.release_name }}" \
              --notes "Immutable Norbital platform release manifest and digest-pinned OCI images."
          fi
          gh release upload \
            "$RELEASE_TAG" \
            dist/platform-release.json \
            dist/builder-toolchain-verification.json \
            dist/builder-benchmark.json \
            dist/builder-benchmarks/*.json \
            dist/package-archives/config.tgz \
            dist/package-archives/platform-utils.tgz \
            dist/package-archives/pod.tgz \
            dist/package-archives/std.tgz \
            dist/package-archives/ui.tgz
