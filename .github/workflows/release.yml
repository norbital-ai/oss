name: Release packages

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/**'
      - 'scripts/build-package.mjs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

env:
  PACKAGE_REGISTRY_URL: ${{ vars.NORBITAL_PACKAGE_REGISTRY || 'https://npm.pkg.github.com' }}
  EXPECTED_PACKAGE_KEY: 7880d265aad7e012

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The schedule-owner parity suite compares the runtime against the real public authoring
      # tree. Release runs execute that same suite as CI, so they need the same explicit fixture.
      - name: Checkout public template fixtures
        uses: actions/checkout@v7
        with:
          repository: norbital-ai/templates
          path: template-fixtures

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.0.0
          registry-url: ${{ env.PACKAGE_REGISTRY_URL }}
          scope: '@norbital-ai'
          package-manager-cache: false

      # npm owns the final normalized tar stream. Pinning it makes the package key independent of
      # whichever npm patch release a floating Node.js image happens to bundle.
      - name: Pin archive packer
        run: |
          npm install --global npm@11.12.1
          test "$(npm --version)" = "11.12.1"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # Run the same package gates as CI before anything can reach the registry. This builds every
      # publishable package once, so each package's prepack below is a turbo cache hit.
      #
      # `check:packages:ci` also packs and inspects every public archive, including declaration emit,
      # local-protocol removal, license, provenance metadata, and the coherent release version.
      - name: Check publishable packages
        run: pnpm check:packages:ci
        env:
          NORBITAL_TEMPLATE_SOURCE: ${{ github.workspace }}/template-fixtures

      # Skipped, not failed, when this version is already on the registry.
      #
      # This workflow fires on every push touching `packages/**`, and most of those do not bump the
      # version — a test, a comment, a rename. Each one used to end in `409 Conflict - Cannot publish
      # over existing version` and a red release, which is the shape of failure that teaches everyone
      # to ignore a red release. The next one that means something would have been ignored too.
      #
      # Checked per package rather than once, because the set must stay coherent: if a version is
      # only partly published, the remaining packages still publish and the set converges without
      # turning an ordinary source-only push into a failed release.
      - name: Publish one coherent package set
        run: |
          set -euo pipefail
          node scripts/resolve-published-packages.mjs \
            --source workspace \
            --archive-base-url "$PACKAGE_REGISTRY_URL" \
            --output dist/package-release.json \
            --archive-output dist/package-archives
          resolved_key="$(node -p "require('./dist/package-release.json').packageKey")"
          test "$resolved_key" = "$EXPECTED_PACKAGE_KEY"
          published=0
          skipped=0
          mapfile -t packages < <(node --input-type=module -e \
            "import { publicPackageDirectories } from './scripts/lib/package-release.mjs'; console.log(publicPackageDirectories.join('\\n'))")
          for package in "${packages[@]}"; do
            name="$(node -p "require('./packages/$package/package.json').name")"
            version="$(node -p "require('./packages/$package/package.json').version")"
            if npm view "$name@$version" version --registry="$PACKAGE_REGISTRY_URL" >/dev/null 2>&1; then
              echo "skip    $name@$version is already published"
              skipped=$((skipped + 1))
              continue
            fi
            echo "publish $name@$version"
            npm publish "dist/package-archives/$package.tgz" \
              --access public \
              --ignore-scripts \
              --provenance \
              --tag realm-v25 \
              --registry="$PACKAGE_REGISTRY_URL"
            published=$((published + 1))
          done
          echo "published=$published skipped=$skipped"
          if [ "$published" -eq 0 ]; then
            echo "::notice::Nothing to publish — every package is already at its declared version."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
