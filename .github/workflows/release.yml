name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

env:
  PACKAGE_REGISTRY_URL: ${{ vars.NORBITAL_PACKAGE_REGISTRY || 'https://npm.pkg.github.com' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: ${{ env.PACKAGE_REGISTRY_URL }}
          scope: '@norbital-ai'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Preserve the platform release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLATFORM_TAG=$(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" |
              jq -sr 'add | map(select(.draft == false and .prerelease == false and (.tag_name | startswith("platform-v")))) | sort_by(.published_at) | last | .tag_name'
          )
          if [ -z "$PLATFORM_TAG" ] || [ "$PLATFORM_TAG" = "null" ]; then
            echo "No published platform release exists to preserve as latest" >&2
            exit 1
          fi
          gh release edit "$PLATFORM_TAG" --latest
