name: Release fixed beta packages

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/**'
      - 'scripts/build-package.mjs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  PACKAGE_REGISTRY_URL: ${{ vars.NORBITAL_PACKAGE_REGISTRY || 'https://npm.pkg.github.com' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: ${{ env.PACKAGE_REGISTRY_URL }}
          scope: '@norbital-ai'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # Build every publishable package once, before pnpm runs each package's prepack.
      #
      # Each package's `prepack` is `turbo run build --filter=<pkg>`. Building here avoids repeating
      # the dependency builds once for every package published below.
      # Building here leaves each prepack a cache hit, so the sequential packs do no repeated work.
      # It must run through turbo, and not `pnpm packages:build`, so that turbo's cache is the thing
      # that gets populated — a pnpm-driven build produces the same output and still leaves every
      # prepack a cache miss.
      #
      # This used to anchor on `...@norbital-ai/pod`, whose dependency closure happened to be exactly
      # the publishable set. Pod and platform-utils are gone, and `ui` now closes over what is left:
      # it pulls in std and config. Keep this filter in step with `publicPackageDirectories` in
      # `scripts/lib/package-release.mjs`, which is what `publication:check` reads.
      - name: Build publishable packages
        run: pnpm exec turbo run build --filter=...@norbital-ai/ui --filter=...@norbital-ai/bolt --filter=...@norbital-ai/bolt-server

      # Skipped, not failed, when this version is already on the registry.
      #
      # This workflow fires on every push touching `packages/**`, and most of those do not bump the
      # version — a test, a comment, a rename. Each one used to end in `409 Conflict - Cannot publish
      # over existing version` and a red release, which is the shape of failure that teaches everyone
      # to ignore a red release. The next one that means something would have been ignored too.
      #
      # Checked per package rather than once, because the set must stay coherent: if a version is
      # only partly published, the remaining packages still publish and the set converges without
      # turning an ordinary source-only push into a failed release.
      - name: Publish one coherent beta package set
        run: |
          set -euo pipefail
          published=0
          skipped=0
          for package in config std ui bolt-protocol bolt-server bolt; do
            name="$(node -p "require('./packages/$package/package.json').name")"
            version="$(node -p "require('./packages/$package/package.json').version")"
            if npm view "$name@$version" version --registry="$PACKAGE_REGISTRY_URL" >/dev/null 2>&1; then
              echo "skip    $name@$version is already published"
              skipped=$((skipped + 1))
              continue
            fi
            echo "publish $name@$version"
            pnpm --dir "packages/$package" publish --access public --no-git-checks --force
            published=$((published + 1))
          done
          echo "published=$published skipped=$skipped"
          if [ "$published" -eq 0 ]; then
            echo "::notice::Nothing to publish — every package is already at its declared version."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
