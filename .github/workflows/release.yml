name: Release fixed beta packages

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/**'
      - 'scripts/build-package.mjs'
      - 'scripts/lib/**'
      - 'scripts/tests/package-release.test.mjs'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  PACKAGE_REGISTRY_URL: ${{ vars.NORBITAL_PACKAGE_REGISTRY || 'https://npm.pkg.github.com' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: ${{ env.PACKAGE_REGISTRY_URL }}
          scope: '@norbital-ai'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Enforce the fixed beta version
        run: |
          node --input-type=module <<'NODE'
          import {
            assertBetaPackageVersions,
            readPublicPackageEntries
          } from './scripts/lib/package-release.mjs';
          const entries = readPublicPackageEntries(process.cwd());
          assertBetaPackageVersions(entries);
          console.log(entries.map(({ name, version }) => `${name}@${version}`).join('\n'));
          NODE

      # Build every publishable package once, before pnpm runs each package's prepack.
      #
      # Each package's `prepack` is `turbo run build --filter=<pkg>`. Building here avoids repeating
      # the dependency builds once for every package published below.
      # Building here leaves each prepack a cache hit, so the sequential packs do no repeated work.
      # It must run through turbo, and not `pnpm packages:build`, so that turbo's cache is the thing
      # that gets populated — a pnpm-driven build produces the same output and still leaves every
      # prepack a cache miss. `...@norbital-ai/pod` is pod and its dependencies, which is exactly the
      # five publishable packages and none of the templates.
      - name: Build publishable packages
        run: pnpm exec turbo run build --filter=...@norbital-ai/pod

      - name: Remove prior beta package records
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const moduleUrl = pathToFileURL(
              path.join(process.env.GITHUB_WORKSPACE, 'scripts/lib/package-release.mjs')
            ).href;
            const { publicPackageDirectories } = await import(moduleUrl);
            for (const packageName of publicPackageDirectories) {
              const versions = await github.paginate(
                'GET /orgs/{org}/packages/{package_type}/{package_name}/versions',
                {
                  org: context.repo.owner,
                  package_type: 'npm',
                  package_name: packageName,
                  per_page: 100
                }
              );
              core.info(`Removing ${versions.length} version(s) of @${context.repo.owner}/${packageName}`);
              for (const version of versions) {
                await github.request(
                  'DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}',
                  {
                    org: context.repo.owner,
                    package_type: 'npm',
                    package_name: packageName,
                    package_version_id: version.id
                  }
                );
              }
            }

      - name: Publish one coherent beta package set
        run: |
          for package in config std platform-utils ui pod; do
            pnpm --dir "packages/$package" publish --access public --no-git-checks --force
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
