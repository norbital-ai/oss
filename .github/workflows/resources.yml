name: Resources

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The live resource benchmark (packages/bolt/bench), on a runner of its own so no other job's load reaches its timings.
# CPU and latency are judged in reference units against bench/budget.json; counts and bytes against their ceilings.
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # the benchmark runs Bolt and its test kit from source: their builds generate the source files they import
      - name: Build packages
        run: pnpm exec turbo run build --filter='@norbital-ai/bolt-cli...' --concurrency=1

      - name: Benchmark
        run: pnpm --dir packages/bolt bench:resources
