name: Convert service

# Norbital Convert (services/convert): its suite runs inside the image it ships, where pandoc and Typst are real. main
# publishes ghcr.io/norbital-ai/convert at services/convert/package.json's version, once: a version already on the
# registry is never overwritten, so a deployed pin keeps meaning the bytes it was tested with.
on:
  pull_request:
    paths: ['services/convert/**', '.github/workflows/convert-service.yml']
  push:
    branches: [main]
    paths: ['services/convert/**', '.github/workflows/convert-service.yml']

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/norbital-ai/convert
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t convert:ci services/convert

      - name: Test inside the image
        run: docker run --rm --entrypoint node convert:ci --test tests/service.test.ts

      - name: Publish a new version
        if: github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./services/convert/package.json').version")
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "$IMAGE:$version" > /dev/null 2>&1; then
            echo "$IMAGE:$version is already published; bump services/convert/package.json to publish."
            exit 0
          fi
          docker tag convert:ci "$IMAGE:$version"
          docker tag convert:ci "$IMAGE:latest"
          docker push "$IMAGE:$version"
          docker push "$IMAGE:latest"
