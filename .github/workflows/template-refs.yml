name: Publish template refs

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/lib/templates.mjs'
      - 'scripts/project-templates.mjs'
      - 'scripts/validate-template-projections.mjs'
      - 'template_workspaces/**'
      - '.github/workflows/template-refs.yml'
  workflow_dispatch:

concurrency:
  group: template-refs-${{ github.ref }}
  cancel-in-progress: true

# `packages: read` resolves the published `@norbital-ai/*` versions a template pins, the same
# reason the CI workflow grants it.
permissions:
  contents: write
  packages: read

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@norbital-ai'

      # A template pins published `@norbital-ai/*` versions, so this install reaches the scoped
      # registry rather than resolving them from the workspace. Without the credential it 401s the
      # moment a repin names a version the lockfile cache has never fetched.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Validate template catalogue
        run: node scripts/project-templates.mjs --check

      - name: Validate template package policies
        run: node --test scripts/tests/templates.test.mjs

      # This workflow already reruns when the projection validator changes, but nothing ever ran it,
      # so a projection that omitted a tracked file or carried an untracked one would publish
      # unnoticed. Check before pushing refs, not after.
      - name: Validate template projections
        run: node scripts/validate-template-projections.mjs

      - name: Project and publish root template refs
        run: |
          node scripts/project-templates.mjs \
            --source-revision "$GITHUB_SHA" \
            --repository "$SOURCE_REPOSITORY_URL" \
            --push origin \
            --output dist/template-revisions.json
        env:
          SOURCE_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git

      - name: Upload resolved template revisions
        uses: actions/upload-artifact@v7
        with:
          name: template-revisions-${{ github.sha }}
          path: dist/template-revisions.json
          if-no-files-found: error
          retention-days: 30
