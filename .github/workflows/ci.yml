name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `packages: read` lets the template lockfile check resolve published `@norbital-ai/*`
# versions from the configured registry, the same way a projected template does.
permissions:
  contents: read
  packages: read

env:
  NORBITAL_PACKAGE_REGISTRY: ${{ vars.NORBITAL_PACKAGE_REGISTRY || 'https://npm.pkg.github.com' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: ${{ env.NORBITAL_PACKAGE_REGISTRY }}
          scope: '@norbital-ai'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check packages and templates
        run: pnpm check:ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # Proves the committed lockfiles are what a Core host installs: warm one shared
      # store over the network, then install with no network and no credentials.
      - name: Verify offline installability
        run: pnpm templates:lock:verify
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # The bundle format is the only cross-version contract between a template and a host, and this
      # is the only thing that proves it: a real build against a materialized depset, booted, and
      # answering with its `ready` frame. It existed unwired for long enough that a host-transport
      # change shipped without it ever running. A gate nobody runs is not a gate.
      - name: Verify the runtime bundle boots
        run: node scripts/smoke-runtime-bundle.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
