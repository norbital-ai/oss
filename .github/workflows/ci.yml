name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No `packages: read`. Every `@norbital-ai/*` dependency in this workspace resolves to
# `workspace:* -> link:`, and no other dependency is scoped to a private registry, so nothing here
# ever authenticates against one. Publishing lives in release.yml, which holds that permission
# alone.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Bolt's HTTP contract test starts Convert in process; it owns a separate frozen dependency graph.
      - name: Install Convert test dependencies
        run: pnpm --dir services/convert install --ignore-workspace --frozen-lockfile --ignore-scripts

      # Bolt's Vitest browser project (https://vitest.dev/guide/browser/) needs Playwright Chromium.
      # Without the browser those tests fail as "Executable doesn't exist", which is a runner
      # gap rather than a driver verdict; a skip would make the suite green without the proof.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Public and private templates have their own repositories and CI; this repository gates the
      # publishable package graph plus the one oss suite (`pnpm test`). Each phase is its own step so a
      # stalled phase names itself in the run summary instead of disappearing inside one long step.
      - name: Build packages
        run: pnpm exec turbo run build --concurrency=1

      - name: Lint
        run: pnpm exec turbo run lint --concurrency=1

      - name: Types compatibility
        run: pnpm types:compat

      - name: Check packed archives
        run: pnpm publication:check

  # The suite is sharded across four runners: 3,080 tests in one job took minutes on a shared
  # two-vCPU runner and hid the slow project behind one step. Each shard is a quarter of the suite,
  # has its own log, and must finish inside the test budget.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Convert test dependencies
        run: pnpm --dir services/convert install --ignore-workspace --frozen-lockfile --ignore-scripts

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test shard ${{ matrix.shard }}
        timeout-minutes: 4
        run: pnpm test --maxWorkers=2 --shard=${{ matrix.shard }}/4
