name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  NORBITAL_PACKAGE_REGISTRY: ${{ vars.NORBITAL_PACKAGE_REGISTRY || 'https://npm.pkg.github.com' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Schedule parity is intentionally checked against the real public authoring tree. Local realm
      # checkouts keep it beside OSS; the isolated Actions workspace needs the same source explicitly.
      - name: Checkout public template fixtures
        uses: actions/checkout@v7
        with:
          repository: norbital-ai/templates
          path: template-fixtures

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: ${{ env.NORBITAL_PACKAGE_REGISTRY }}
          scope: '@norbital-ai'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      # Public and private templates have their own repositories and CI; this repository gates the
      # publishable package graph plus the tests that exercise those packages.
      - name: Check publishable packages
        run: pnpm check:packages:ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
          NORBITAL_TEMPLATE_SOURCE: ${{ github.workspace }}/template-fixtures
