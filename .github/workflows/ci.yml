name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No `packages: read`. Every `@norbital-ai/*` dependency in this workspace resolves to
# `workspace:* -> link:`, and no other dependency is scoped to a private registry, so nothing here
# ever authenticates against one. Publishing lives in release.yml, which holds that permission
# alone.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NORBITAL_TEMPLATE_SOURCE: ${{ github.workspace }}/template-fixtures
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Schedule parity reads templates only when NORBITAL_TEMPLATE_SOURCE is set. This checkout is
      # that explicit tree — not a sibling `templates/` guess beside oss.
      - name: Checkout public template fixtures
        uses: actions/checkout@v7
        with:
          repository: norbital-ai/templates
          path: template-fixtures

      # API reference is generated by the website build from published packages; it must never
      # be committed here (bitrot of a generated tree broke the last committed copy).
      - name: No committed generated API reference
        run: test ! -d docs/api-reference

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Public and private templates have their own repositories and CI; this repository gates the
      # publishable package graph plus the tests that exercise those packages.
      #
      # `test` here is the unit suite. Bolt's database-backed suite runs in integration.yml — see
      # packages/bolt/vitest.config.ts for why it is not on the merge path.
      - name: Check publishable packages
        run: pnpm check:packages:ci
