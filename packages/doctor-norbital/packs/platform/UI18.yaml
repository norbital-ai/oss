id: UI18
summary: client UI sends a raw transport command instead of using the generated API
severity: error
principles: [simplicity, straightforwardness, modularity, type-safety]
files:
  - '**/ui/**'
  - '**/*.svelte'
rule:
  all:
    - kind: CallExpression
    - regex: '\b(?:transport|connection|socket)\.(?:command|execute|send|invoke)\b'
examples:
  file: src/ui/probe.ts
  bad:
    - 'export const f = () => transport.command({});'
  good:
    - 'export const f = () => client.db.things.create({});'
