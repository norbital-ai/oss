id: E3
summary: env get-or-throw or re-validation wrapper
severity: error
principles: [ simplicity, straightforwardness, no-bloat ]
rule:
  any:
    - 'process.env[$NAME] ?? $FALLBACK'
    - 'process.env[$NAME] || $FALLBACK'
examples:
  bad:
    - "const url = process.env['SECRET_URL'] ?? '';"
  good:
    - 'const url = config.secretUrl;'
    - const url = process.env['SECRET_URL'];
    - const url = config.secretUrl ?? '';
    - const url = process.env.SECRET_URL ?? '';
