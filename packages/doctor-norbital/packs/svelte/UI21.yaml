id: UI21
summary: viewport or arbitrary height class bypasses Bound
severity: error
principles: [simplicity, straightforwardness, colocation]
files:
  - '**/*.svelte'
rule:
  all:
    - kind: svelte:ClassToken
    - regex: '^(?:h|w|min-h|min-w)-(?:screen|\[)'
    - not:
        inside:
          all:
            - kind: svelte:Element
            - has:
                field: tagName
                regex: '^(?:Stack|Inline|Cluster|Grid|Bound|Cover|Scroll)$'
        stopBy: end
examples:
  bad:
    - '<div class="h-screen w-screen"></div>'
    - '<div class="h-[calc(100dvh-4rem)]"></div>'
  good:
    - '<Bound height="viewport"><p>x</p></Bound>'
