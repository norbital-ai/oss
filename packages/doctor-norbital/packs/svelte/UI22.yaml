id: UI22
summary: raw overflow-hidden bypasses Bound clipping
severity: error
principles: [simplicity, straightforwardness, colocation]
files:
  - '**/*.svelte'
rule:
  all:
    - kind: svelte:ClassToken
    - regex: '^overflow-hidden$'
examples:
  bad:
    - '<div class="overflow-hidden"></div>'
  good:
    - '<Bound clip><p>x</p></Bound>'
