id: EFF1
summary: native try/catch bypasses Effect error control
severity: error
principles: [straightforwardness, testability, type-safety]
rule:
  all:
    - kind: TryStatement
    - fact: { name: usesImportedRuntime, from: effect, symbol: Effect }
examples:
  bad:
    - "import { Effect } from 'effect';\nconst owned = Effect.succeed(1);\nexport const f = () => { try { go(); } catch (e) { report(e); } };"
  good:
    - "import { Effect } from 'effect';\nconst owned = Effect.succeed(1);\nexport const f = () => Effect.try(go);"
