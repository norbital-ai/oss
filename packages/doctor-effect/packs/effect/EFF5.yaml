id: EFF5
summary: Effect workflow reads ambient time or randomness
severity: error
principles: [straightforwardness, testability]
rule:
  all:
    - any:
        - pattern: Date.now()
        - pattern: Math.random()
        - pattern: performance.now()
        - pattern: crypto.randomUUID()
        - pattern: new Date()
    - importsFrom: effect
    - inside:
        any:
          - pattern: Effect.gen($FN)
          - pattern: Effect.sync($FN)
          - pattern: Effect.promise($FN)
          - pattern: Effect.fn($FN)
          - pattern: Effect.try($FN)
          - pattern: Effect.tryPromise($FN)
      stopBy: end
examples:
  bad:
    - "import { Effect } from 'effect';\nexport const f = Effect.gen(function* () { const t = Date.now(); return yield* Effect.succeed(t); });"
  good:
    - "import { Effect } from 'effect';\nexport const f = Effect.gen(function* () { return yield* Clock.currentTimeMillis; });"
