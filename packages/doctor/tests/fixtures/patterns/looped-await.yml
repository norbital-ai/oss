# A relational combinator: the await must sit somewhere inside a counted `for` loop.
# The matcher honours one key per object and reads `stopBy` beside the relational key,
# so an atomic claim and a relational one compose through `all`.
id: LOOPEDAWAIT
summary: an await inside a counted loop serialises what could run concurrently
severity: hint
principles: [efficiency]
rule:
  all:
    - pattern: await $PROMISE
    - inside:
        kind: ForStatement
      stopBy: end
examples:
  bad:
    - 'export async function run(items) { for (let i = 0; i < items.length; i++) { await send(items[i]); } }'
  good:
    - 'export async function run(items) { await Promise.all(items.map(send)); }'
