id: V6
summary: async IIFE in lifecycle code
severity: error
principles: [ straightforwardness, testability ]
rule:
  any:
    - '(async () => $BODY)()'
    - '(async function () { $BODY })()'
    - '(async () => { $BODY })()'
examples:
  bad:
    - export const f = () => { void (async () => { await go(); })(); };
  good:
    - 'export const f = () => { void go(); };'
    - export const f = async () => { await go(); };
    - export const f = () => { (() => { go(); })(); };
