id: P9
summary: export-star barrel
severity: hint
principles: [ simplicity, colocation, no-bloat ]
rule:
  all:
    - kind: ExportDeclaration
    - regex: '^export \* from '
examples:
  bad:
    - "export * from './other.js';"
  good:
    - "export { thing } from './other.js';"
    - export { a, b } from './x.js';
    - export type { A } from './x.js';
    - |-
      import * as ns from './x.js';
      export const n = ns;
