id: LOG1
summary: runtime console call bypasses structured logging
severity: error
principles: [straightforwardness, testability]
ignore:
  - '**/scripts/**'
  - '**/script/**'
  - '**/bin/**'
  - '**/cli/**'
  - '**/tools/**'
  - '**/*.config.ts'
  - '**/*.config.js'
  - '**/*.config.mjs'
  - '**/*.config.cjs'
  - '**/*.config.mts'
  - '**/*.config.cts'
rule:
  all:
    - kind: CallExpression
    - regex: '^console\.'
examples:
  bad:
    - "export const f = () => console.log('x');"
  good:
    - "export const f = () => Effect.log('x');"
