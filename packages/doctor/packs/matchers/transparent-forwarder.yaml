any:
  - '($A) => $CALLEE($A)'
  - '($A) => { return $CALLEE($A); }'
  - '($A: $T) => $CALLEE($A)'
  - '($A: $T) => { return $CALLEE($A); }'
  - '($A, $B) => $CALLEE($A, $B)'
  - '($A, $B) => { return $CALLEE($A, $B); }'
  - '($A: $T, $B: $U) => $CALLEE($A, $B)'
  - '($A: $T, $B: $U) => { return $CALLEE($A, $B); }'
  - '($A, $B, $C) => $CALLEE($A, $B, $C)'
  - '($A, $B, $C) => { return $CALLEE($A, $B, $C); }'
  - 'function $NAME($A) { return $CALLEE($A); }'
  - 'function $NAME($A: $T) { return $CALLEE($A); }'
  - 'function $NAME($A, $B) { return $CALLEE($A, $B); }'
  - 'export function $NAME($A) { return $CALLEE($A); }'
  - 'export function $NAME($A, $B) { return $CALLEE($A, $B); }'
