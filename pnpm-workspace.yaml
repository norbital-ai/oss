minimumReleaseAgeExclude:
  - '@norbital-ai/config@0.0.1'
  - '@norbital-ai/platform-utils@0.0.1'
  - '@norbital-ai/pod@0.0.1'
  - '@norbital-ai/std@0.0.1'
  - '@norbital-ai/ui@0.0.1'

# Host tools execute from this depset, while tenant builds execute in a Linux/musl microVM.
# Include both host-native and guest-native optional packages on macOS, Windows, and Linux hosts.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
    - arm64
  libc:
    - glibc
    - musl
